name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (auto reads commits since the last release)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

# Serialize version allocation through publication. A queued run includes all
# commits since the last published version if several pushes arrive together.
concurrency:
  group: andriloft-releases
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test release automation
        run: python3 -m unittest discover -s tools/tests -v
      - name: Plan semantic version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          mkdir -p build/automation
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[]' | jq -s '.' > build/automation/releases.json
          python3 tools/plan-release.py --releases build/automation/releases.json \
            --bump "$RELEASE_BUMP" --output build/automation/plan.json \
            --notes build/automation/notes.md --github-output "$GITHUB_OUTPUT"
          cat build/automation/plan.json
      - name: Save release plan
        if: steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plan
          path: |
            build/automation/plan.json
            build/automation/notes.md
          if-no-files-found: error
          retention-days: 14

  build:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      ANDRILOFT_VERSION: ${{ needs.plan.outputs.version }}
      ANDRILOFT_BUILD_NUMBER: ${{ needs.plan.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - name: Test release metadata
        run: python3 -m unittest discover -s tools/tests -v
      - name: Build and validate new universal app
        run: ./tools/build-release.sh
      - name: Save verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plan
          path: build/automation
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: build/release
      - name: Verify uploads and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 tools/publish-release.py --plan build/automation/plan.json \
            --notes build/automation/notes.md --assets build/release
